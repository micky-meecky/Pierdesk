<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Pierdesk Screenshot</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151719;color:#e8eaed;font-family:'Segoe UI','Microsoft YaHei',sans-serif;user-select:none}button,input,select,textarea{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #35d99b;outline-offset:2px}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}#hint{position:absolute;top:26px;left:50%;transform:translateX(-50%);background:#202326ed;border:1px solid #ffffff16;box-shadow:0 6px 24px #0004;border-radius:12px;padding:12px 18px;pointer-events:none;font-size:13px;white-space:nowrap}#hint strong{color:#42dda4;font-weight:600;margin-right:14px}#size{position:absolute;padding:4px 8px;font-size:12px;background:#202326e8;border-radius:5px;pointer-events:none;white-space:nowrap}#toolbar{position:absolute;display:none;flex-direction:column;gap:6px;max-width:calc(100vw - 16px);z-index:2}#tools,#options{display:flex;align-items:center;gap:3px;background:#24272afa;border:1px solid #ffffff18;border-radius:11px;padding:6px;box-shadow:0 8px 30px #0006;flex-wrap:wrap}#tools button{display:flex;align-items:center;justify-content:center;min-width:36px;height:36px;border:0;border-radius:6px;background:transparent;padding:7px;position:relative}#tools button:hover,#tools button[aria-pressed=true]{background:#ffffff18;color:#35d99b}#tools button:disabled{opacity:.28;cursor:default}#tools button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}#tools button.cancel{color:#ff727b}#tools button.complete{background:#1bb380;color:#091d16;gap:6px;font-size:13px;font-weight:600;padding:7px 12px}#tools button.complete:hover{background:#42dda4}.divider{height:24px;width:1px;background:#ffffff20;margin:0 4px}#options{align-self:flex-start;font-size:12px;gap:8px;padding:8px 11px;color:#b4bcc2}#options label{display:flex;gap:7px;align-items:center}#options input[type=color]{width:26px;height:25px;padding:0;border:0;background:transparent;cursor:pointer}#options input[type=range]{width:70px;accent-color:#35d99b}#options select{background:#363b40;color:#eef3f5;border:1px solid #ffffff20;border-radius:5px;padding:3px}#text{position:absolute;display:none;z-index:3;resize:none;min-width:130px;min-height:45px;background:#1e2228ee;outline:none;border:1px solid #35d99b;border-radius:4px;padding:4px;white-space:pre;overflow:hidden;user-select:text}#toast{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);max-width:90%;padding:12px 18px;background:#262c33;border:1px solid #ff727b80;border-radius:8px;font-size:13px;z-index:5;display:none}#pin{display:none;position:absolute;inset:0;background:#101315;cursor:move}#pin img{width:100%;height:100%;object-fit:contain;pointer-events:none}#pinbar{position:absolute;top:5px;right:5px;display:flex;gap:4px;opacity:0;transition:opacity .12s}#pin:hover #pinbar,#pin:focus-within #pinbar{opacity:1}#pinbar button{background:#20272def;border:1px solid #ffffff30;border-radius:5px;padding:5px 9px;font-size:12px}#pininfo{position:absolute;bottom:6px;left:6px;font-size:11px;background:#171e25cc;padding:3px 6px;border-radius:4px;opacity:0;pointer-events:none}#pin:hover #pininfo{opacity:1}body.pinned #screen,body.pinned #hint,body.pinned #size,body.pinned #toolbar,body.pinned #text{display:none!important}body.pinned #pin{display:block}
#options [hidden],#tool-cursor[hidden]{display:none!important}#options{flex-wrap:wrap}#tool-sample-wrap{display:flex;flex-direction:column;gap:3px;padding-left:8px;border-left:1px solid #ffffff20}#tool-sample{position:static;width:164px;height:56px;background:#141719;border-radius:5px;cursor:default}#tool-caption{font-size:11px;color:#c6ced4;white-space:nowrap}#tool-cursor{position:absolute;z-index:1;pointer-events:none;transform-origin:top left;white-space:pre;font-family:'Segoe UI','Microsoft YaHei',sans-serif;line-height:1.25}#tool-cursor.brush,#tool-cursor.mosaic{border:1px solid #fff;box-shadow:0 0 0 1px #000, inset 0 0 0 1px #0008}#tool-cursor.brush{border-radius:50%}#tool-cursor.mosaic{background:#ffffff18}#tool-cursor.letter{padding:0;text-shadow:0 1px 2px #000,0 -1px 2px #fff8}#text{padding:0;line-height:1.25;background:transparent;border-radius:0}
</style></head><body>
<canvas id="screen" tabindex="0" aria-label="Screenshot region and annotations"></canvas>
<div id="tool-cursor" aria-hidden="true" hidden></div>
<div id="hint"><strong>Pierdesk</strong><span></span></div><div id="size" hidden></div>
<div id="toolbar" role="toolbar" aria-label="Screenshot tools"><div id="tools"></div><div id="options"><label><span data-i18n="color">颜色</span><input id="color" type="color" value="#ff4e62" aria-label="Color"></label><label><span data-i18n="width">粗细</span><input id="width" type="range" min="2" max="30" value="4" aria-label="Stroke width"><output id="width-value">4</output></label><label><span data-i18n="font">字号</span><select id="font" aria-label="Font size"><option>16</option><option selected>24</option><option>32</option><option>48</option><option>64</option></select></label><span id="tool-sample-wrap" hidden><canvas id="tool-sample" width="164" height="56" aria-label="Actual tool size preview"></canvas><span id="tool-caption" role="status"></span></span></div></div>
<textarea id="text" aria-label="Annotation text" spellcheck="false"></textarea><div id="toast" role="alert"></div>
<div id="pin"><img alt="Pinned screenshot"><div id="pinbar"><button data-pin="copy">复制</button><button data-pin="save">保存</button><button data-pin="close">关闭</button></div><div id="pininfo"></div></div>
<script>/*__EDITOR__*/</script></body></html>
