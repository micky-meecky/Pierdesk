    function renderModal(modal) {
      if (modal.type === 'license-release') return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><h2>${licenseText('解绑本机？','Release this PC?')}</h2><p>${licenseText('请先保存激活码。解绑会停止本机跨屏、剪贴板同步与文件传输；之后可在新电脑使用原码激活。','Save your original code first. Release stops cross-screen, clipboard and file-transfer services on this PC. You can then activate another PC.')}</p><div class="modal-actions"><button class="button" data-action="close-modal">${licenseText('取消','Cancel')}</button><button class="button danger" data-license="confirm-release">${licenseText('确认解绑','Confirm release')}</button></div></section></div>`;
      if (modal.type.startsWith('ssh-')) return renderSshModal(modal);
      if (modal.type === 'support-qr') {
        const wechat = modal.provider === 'wechat';
        return `<div class="modal-backdrop" role="presentation"><section class="modal support-qr-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">${wechat?'微信支付':'支付宝'} · 感谢支持</h2><p>使用手机扫描下方二维码；金额由你决定。</p><img class="support-qr-large" src="${wechat?'__WECHAT_SUPPORT_QR__':'__ALIPAY_SUPPORT_QR__'}" alt="${wechat?'微信支付 / WeChat Pay':'支付宝 / Alipay'} 二维码"><div class="modal-actions"><button class="button primary" data-action="close-modal">关闭</button></div></section></div>`;
      }
      if (modal.type === 'boundary-advanced') {
        return `<div class="modal-backdrop" role="presentation"><section class="modal wide boundary-advanced-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="boundary-advanced-modal-head"><div><h2 id="modal-title">高级设置</h2><p>当前运行设置会继续控制实际跨屏行为。</p></div><button class="button" data-action="close-modal">关闭</button></div>${boundaryRuntimeSettingsMarkup(currentModel().cross)}</section></div>`;
      }
      if (modal.type === 'compatibility') {
        return `<div class="modal-backdrop" role="presentation"><section class="modal wide" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">跨屏控制兼容性说明</h2><div class="modal-section"><h3>权限边界</h3><p>普通权限运行时不能控制管理员权限窗口。以管理员身份运行可覆盖大多数桌面应用，但 Windows 的 UAC 安全桌面、登录界面与 Ctrl+Alt+Del 始终不会被接管。</p></div><div class="modal-section"><h3>应用兼容性</h3><p>跨屏控制面向常规 Windows 桌面应用。游戏、反作弊程序、Raw Input、独占全屏、远程桌面或其他主动拦截输入的软件不在兼容优化范围内。</p></div><div class="modal-section"><h3>连接与文件</h3><p>屏幕布局通过已配对的双向 TLS 通道自动同步；四角保护范围仅影响本机越界。跨设备文件移动继续使用 Pierdesk 文件剪贴板与独立传输中心。</p></div><div class="modal-actions"><button class="button primary" data-action="close-modal">知道了</button></div></section></div>`;
      }
      const content = modal.type === 'revoke' ? { title: `取消配对“${escapeHtml(modal.label)}”？`, body: '请先在远程工作中撤销该设备的 SSH 授权。取消配对后需要重新核对验证码才能恢复连接。', action: 'confirm-revoke', button: '取消配对' } : modal.type === 'cancel-all' ? { title: '取消全部传输？', body: '所有正在等待、接收或暂停的任务都会被取消。', action: 'confirm-cancel-all', button: '全部取消' } : { title: '退出 Pierdesk？', body: '跨屏控制、剪贴板同步和传输服务将停止。SSH 服务和已有授权会保留。', action: 'confirm-exit', button: '退出程序' };
      return `<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">${content.title}</h2><p>${content.body}</p><div class="modal-actions"><button class="button" data-action="close-modal">返回</button><button class="button danger" data-action="${content.action}" data-fingerprint="${escapeHtml(modal.fingerprint || '')}">${content.button}</button></div></section></div>`;
    }

    function rememberScroll() {
      const content = document.querySelector('.content');
      if (content && state.scrollResetPage !== state.page) state.scrollByPage[state.page] = content.scrollTop;
    }
    function hasActiveTextSelection() {
      const selection = window.getSelection?.();
      const root = document.getElementById('root');
      return Boolean(selection && !selection.isCollapsed && selection.toString() && root.contains(selection.anchorNode) && root.contains(selection.focusNode));
    }
    function hasEditableFocus() { return document.activeElement?.matches('input,select,textarea,[contenteditable="true"]') === true; }
    function shouldDeferModelRender() {
      const liveSshModal = state.modal && ['ssh-local','ssh-waiting'].includes(state.modal.type);
      return state.interacting || hasEditableFocus() || hasActiveTextSelection() || Boolean(state.modal && !liveSshModal);
    }
    function flushDeferredModel() {
      if (!state.modelDirty || shouldDeferModelRender()) return;
      state.modelDirty = false;
      render();
    }
    function render() {
      rememberScroll();
      state.modelDirty = false;
      if (!visiblePages().some(([key]) => key === state.page)) state.page = 'status';
      const renderer = { status:renderStatus, devices:renderDevices, cross:renderCross, clipboard:renderClipboard, transfer:renderTransfer, connection:renderConnection, general:renderGeneral, license:renderLicense, support:renderSupport, about:renderAbout, remote:renderRemote }[state.page] || renderStatus;
      document.getElementById('root').innerHTML = shell(renderer());
      const fontScale = document.getElementById('font-scale');
      if (fontScale) {
        const value = clamp(currentModel().fontScale || 100, 50, 125);
        fontScale.min = '50';
        fontScale.value = String(value);
        document.getElementById('font-scale-output').textContent = `${value}%`;
      }
      applyAppearance();
      localizeDocument();
      const content = document.querySelector('.content');
      if (content) {
        if (state.scrollResetPage === state.page) {
          state.scrollByPage[state.page] = 0;
          content.scrollTop = 0;
          state.scrollResetPage = '';
        } else content.scrollTop = state.scrollByPage[state.page] || 0;
      }
      const modalButton = document.querySelector('.modal button');
      if (state.modal && modalButton) modalButton.focus();
    }

    function send(message) {
      if (window.chrome?.webview) window.chrome.webview.postMessage(message);
      else if (message.action === 'set-layout') setTimeout(() => applyPreviewCommand(message), 900);
      else applyPreviewCommand(message);
    }
    function applyPreviewCommand(message) {
      if (message.action.startsWith('window-') || message.action === 'open-log' || message.action === 'open-log-folder' || message.action === 'open-source' || message.action === 'open-transfer') return;
      if (message.action === 'preview-boundary-workspace-v3') return;
      const m = currentModel();
      if (message.action === 'set-cross-enabled') m.cross.enabled = message.enabled;
      if (message.action === 'set-boundary-map-v2-enabled') m.cross.boundaryMapV2Enabled = message.enabled;
      if (message.action === 'pause-cross') m.cross.state = '已暂停';
      if (message.action === 'resume-cross') m.cross.state = '已连接';
      if (message.action === 'set-placement') m.cross.placement = message.placement;
      if (message.action === 'set-corner-enabled') m.cross.cornerGuardEnabled = message.enabled;
      if (message.action === 'set-corner-pixels') m.cross.cornerGuardPixels = message.pixels;
      if (message.action === 'set-second-push') m.cross.requireSecondPush = message.enabled;
      if (message.action === 'set-fullscreen-pause') m.cross.pauseOnFullscreen = message.enabled;
      if (message.action === 'set-keep-link-warm') m.cross.keepLinkWarm = message.enabled;
      if (message.action === 'save-boundary-map') {
        m.boundaryMap = boundaryClone(message.boundaryMap);
        m.boundaryMap.revision = (Number(m.boundaryMap.revision) || 0) + 1;
        state.boundaryDraft = null;
        state.boundaryDirty = false;
        state.boundarySaving = false;
        state.boundarySaveRevision = null;
        state.boundaryConflict = null;
      }
      if (message.action === 'save-boundary-workspace-v3') {
        const previous = m.boundaryWorkspaceV3;
        const draft = boundaryClone(message.boundaryLayout);
        if (previous) draft.revision = (Number(draft.revision) || 0) + 1;
        m.boundaryWorkspaceV3 = {
          schemaVersion: 3,
          storageRevision: previous ? (Number(previous.storageRevision) || 0) + 1 : 0,
          draft,
          applied: previous?.applied || null
        };
        m.boundaryWorkspaceV3Applied = Boolean(m.boundaryWorkspaceV3.applied && !m.boundaryWorkspaceV3.draft.boundaries.some(boundary => boundary.localConfirmedRevision !== boundary.mappingRevision || boundary.peerConfirmedRevision !== boundary.mappingRevision));
        const editor = boundaryV3State();
        const savedMessage = editor.message;
        const completeAfterSave = editor.completeAfterSave;
        boundaryV3LoadModel(m, false, completeAfterSave);
        boundaryV3State().completeAfterSave = false;
        boundaryV3State().message = savedMessage;
      }
      if (message.action === 'apply-boundary-workspace-v3' && m.boundaryWorkspaceV3) {
        m.boundaryWorkspaceV3.applied = { layout: boundaryClone(m.boundaryWorkspaceV3.draft), cornerGuardPixels: 32, minimumPortalPixels: 64 };
        m.boundaryWorkspaceV3.storageRevision += 1;
        m.boundaryWorkspaceV3Applied = true;
        boundaryV3LoadModel(m);
      }
      if (message.action === 'accept-boundary-workspace-preview' && m.boundaryRemoteWorkspace?.layout) {
        const draft=boundaryClone(m.boundaryRemoteWorkspace.layout);
        draft.boundaries.forEach(boundary=>boundary.localConfirmedRevision=boundary.mappingRevision);
        m.boundaryWorkspaceV3={schemaVersion:3,storageRevision:Number(m.boundaryWorkspaceV3?.storageRevision||-1)+1,draft,applied:m.boundaryWorkspaceV3?.applied||null};
        if(draft.boundaries.length&&draft.boundaries.every(boundary=>boundary.localConfirmedRevision===boundary.mappingRevision&&boundary.peerConfirmedRevision===boundary.mappingRevision)){
          m.boundaryWorkspaceV3.applied={layout:boundaryClone(draft),cornerGuardPixels:32,minimumPortalPixels:64};
          m.boundaryWorkspaceV3.storageRevision+=1;
          m.boundaryWorkspaceV3Applied=true;
        }
        m.boundaryRemoteWorkspace=null;
        boundaryV3LoadModel(m);
      }
      if (message.action === 'set-shared-enabled') m.shared.enabled = message.enabled;
      if (message.action === 'set-auto-popup') m.transfer.autoPopup = message.enabled;
      if (message.action === 'set-history-limit') m.transfer.historyLimit = message.value;
      if (message.action === 'set-row-height') m.transfer.rowHeight = message.value;
      if (message.action === 'set-autostart') m.autostart = message.enabled;
      if (message.action === 'set-language') m.language = message.language;
      if (message.action === 'set-theme') m.theme = message.theme;
      if (message.action === 'set-font-scale') m.fontScale = message.value;
      if (message.action === 'select-peer' || message.action === 'set-layout') {
        m.peers.forEach(peer => peer.current = peer.fingerprint === message.fingerprint);
        const selected = m.peers.find(peer => peer.current);
        if (selected) { m.peerLabel = selected.label; m.connection.activePeer = selected.fingerprint; m.connection.peerEndpoint = selected.endpoint; }
      }
      if (message.action === 'set-layout') m.cross.placement = message.placement;
      if (message.action === 'pair') { const device = m.discovered.find(item => item.fingerprint === message.fingerprint); if (device) { m.pairing = {fingerprint:device.fingerprint,label:device.label,code:'481 275'}; m.pairingMessage = `请在两台设备上核对验证码，然后确认是否配对“${device.label}”`; } }
      if (message.action === 'approve-pairing' || message.action === 'reject-pairing') { m.pairing = null; m.pairingMessage = message.action === 'approve-pairing' ? '已批准，正在等待另一台设备确认…' : '已拒绝配对请求'; }
      if (message.action === 'revoke') m.peers = m.peers.filter(p => p.fingerprint !== message.fingerprint);
      if (message.action === 'save-connection') { m.connection = {...m.connection,...message,configured:true,valid:true}; state.connectionDraft = null; }
      if (pendingLayoutMatches(m)) clearPendingLayout();
      showToast('预览状态已更新');
      render();
    }
    function showToast(message, options = {}) {
      const toast = document.getElementById('toast');
      let translated = message;
      if (currentModel().language === 'en') {
        if (String(message).startsWith('操作未完成：')) {
          const detail = translateText(String(message).slice('操作未完成：'.length).trim());
          translated = `Could not complete: ${/\p{Script=Han}/u.test(detail) ? runtimeErrorText(detail) : detail}`;
        } else translated = translateText(message);
      }
      toast.textContent = translated;
      toast.classList.toggle('top', options.placement === 'top');
      toast.classList.toggle('success', options.tone === 'success');
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), options.duration || 1800);
    }
    function navigate(page) { if (!visiblePages().some(([key]) => key === page)) return; rememberScroll(); state.page = page; state.modal = null; render(); }

    document.addEventListener('pointerdown', event => {
      const edge = event.target.closest('[data-edge]')?.dataset.edge;
      if (edge) { event.preventDefault(); send({action:'window-resize',edge}); return; }
      if (event.target.closest('[data-drag-region]') && !event.target.closest('button,select,input,a')) {
        event.preventDefault(); send({action:'window-drag'}); return;
      }
      state.interacting = true;
    }, true);
    document.addEventListener('pointerup', () => {
      state.interacting = false;
      if (state.modelDirty) setTimeout(flushDeferredModel, 160);
    }, true);
    document.addEventListener('selectionchange', () => {
      clearTimeout(state.selectionTimer);
      if (!hasActiveTextSelection()) state.selectionTimer = setTimeout(flushDeferredModel, 220);
    });
    document.addEventListener('focusout', () => setTimeout(flushDeferredModel, 120), true);
    document.addEventListener('scroll', event => {
      if (event.target.classList?.contains('content')) state.scrollByPage[state.page] = event.target.scrollTop;
    }, true);

    document.addEventListener('click', event => {
      const page = event.target.closest('[data-page]')?.dataset.page;
      if (page) { navigate(page); return; }
      const copy = event.target.closest('[data-copy]');
      if (copy) { copyText(copy.dataset.copy); return; }
      const windowAction = event.target.closest('[data-window]')?.dataset.window;
      if (windowAction) { send({action:`window-${windowAction}`}); return; }
      const confirm = event.target.closest('[data-confirm]');
      if (confirm && !confirm.disabled) { state.modal = { type: confirm.dataset.confirm, fingerprint: confirm.dataset.fingerprint, label: confirm.dataset.label }; render(); return; }
      const placement = event.target.closest('[data-placement]')?.dataset.placement;
      if (placement) { send({action:'set-placement',placement}); return; }
      const step = event.target.closest('[data-step]');
      if (step) {
        const m = currentModel(), delta = Number(step.dataset.delta), kind = step.dataset.step;
        if (kind === 'history') {
          const input = document.getElementById('history-limit');
          const base = Number(input?.value) || m.transfer.historyLimit;
          const value = clamp(base + delta, 1, 500);
          m.transfer.historyLimit = value;
          send({action:'set-history-limit', value});
        }
        else send({action:'set-row-height', value:Math.max(64,Math.min(96,m.transfer.rowHeight + delta * 4))});
        return;
      }
      const target = event.target.closest('[data-action]');
      if (!target || target.disabled) return;
      const action = target.dataset.action;
      const m = currentModel();
      const map = {
        refresh: {action:'refresh'}, 'open-log':{action:'open-log'}, 'open-log-folder':{action:'open-log-folder'}, 'open-source':{action:'open-source'}, 'open-transfer':{action:'open-transfer'}, 'open-transfer-history':{action:'open-transfer',history:true},
        'pause-all':{action:'pause-all'}, 'resume-all':{action:'resume-all'}, 'accept-pending':{action:'accept-pending'},
        'pause-cross':{action:'pause-cross'}, 'resume-cross':{action:'resume-cross'}, 'return-local':{action:'return-local'}, 'restart-admin':{action:'restart-admin'},
        'approve-pairing':{action:'approve-pairing'}, 'reject-pairing':{action:'reject-pairing'}
      };
      if (action === 'toggle-cross') send({action:'set-cross-enabled',enabled:!m.cross.enabled});
      else if (action === 'toggle-pair') {
        const fingerprint = target.dataset.fingerprint;
        const row = (m.pairSwitches || []).find(item => item.fingerprint === fingerprint);
        if (row) {
          row.enabled = !row.enabled;
          render();
          send({action:'set-pair-enabled', fingerprint, enabled: row.enabled});
        }
      }
      else if (action === 'toggle-boundary-map-v2') {
        const enabled = m.cross.boundaryMapV2Enabled === false;
        m.cross.boundaryMapV2Enabled = enabled;
        if (state.modal?.type === 'boundary-advanced') render();
        send({action:'set-boundary-map-v2-enabled',enabled});
      }
      else if (action === 'toggle-corner') {
        const enabled = !m.cross.cornerGuardEnabled;
        m.cross.cornerGuardEnabled = enabled;
        if (state.modal?.type === 'boundary-advanced') render();
        send({action:'set-corner-enabled',enabled});
      }
      else if (action === 'toggle-second-push') {
        const enabled = !m.cross.requireSecondPush;
        m.cross.requireSecondPush = enabled;
        if (state.modal?.type === 'boundary-advanced') render();
        send({action:'set-second-push',enabled});
      }
      else if (action === 'toggle-fullscreen') {
        const enabled = !m.cross.pauseOnFullscreen;
        m.cross.pauseOnFullscreen = enabled;
        if (state.modal?.type === 'boundary-advanced') render();
        send({action:'set-fullscreen-pause',enabled});
      }
      else if (action === 'toggle-keep-link-warm') {
        const enabled = m.cross.keepLinkWarm === false;
        m.cross.keepLinkWarm = enabled;
        if (state.modal?.type === 'boundary-advanced') render();
        send({action:'set-keep-link-warm',enabled});
      }
      else if (action === 'toggle-shared') send({action:'set-shared-enabled',enabled:!m.shared.enabled});
      else if (action === 'screenshot') send({action:'screenshot'});
      else if (action === 'screenshot-hotkey-save') send({action:'set-screenshot-shortcut',shortcut:document.getElementById('screenshot-shortcut').value.trim()});
      else if (action === 'toggle-auto-popup') send({action:'set-auto-popup',enabled:!m.transfer.autoPopup});
      else if (action === 'toggle-autostart') send({action:'set-autostart',enabled:!m.autostart});
      else if (action === 'toggle-theme') {
        m.theme = m.theme === 'dark' ? 'light' : 'dark';
        applyAppearance();
        render();
        send({action:'set-theme',theme:m.theme});
      }
      else if (action === 'draft-auto-receive') { state.connectionDraft = state.connectionDraft || {...m.connection}; state.connectionDraft.autoReceive = !state.connectionDraft.autoReceive; render(); }
      else if (action === 'discard-connection') { state.connectionDraft = null; render(); }
      else if (action === 'pair') send({action:'pair',fingerprint:target.dataset.fingerprint});
      else if (action === 'select-peer') send({action:'select-peer',fingerprint:target.dataset.fingerprint});
      else if (action === 'boundary-advanced-settings') { state.modal = {type:'boundary-advanced'}; render(); }
      else if (action === 'compatibility') { state.modal = {type:'compatibility'}; render(); }
      else if (action === 'support-qr') { state.modal = {type:'support-qr',provider:target.dataset.provider}; render(); }
      else if (action === 'pause-task' || action === 'cancel-task') send({action,task:target.dataset.task});
      else if (action === 'close-modal') { state.modal = null; render(); }
      else if (action === 'confirm-revoke') { state.modal = null; send({action:'revoke',fingerprint:target.dataset.fingerprint}); }
      else if (action === 'confirm-cancel-all') { state.modal = null; send({action:'cancel-all'}); }
      else if (action === 'confirm-exit') { state.modal = null; send({action:'exit'}); }
      else if (map[action]) send(map[action]);
    });

    document.addEventListener('input', event => {
      if (event.target.id === 'corner-range') { document.getElementById('corner-output').textContent = `${event.target.value} 像素`; }
      if (event.target.id === 'font-scale') {
        const value = clamp(event.target.value, 50, 125);
        currentModel().fontScale = value;
        document.getElementById('font-scale-output').textContent = `${value}%`;
        applyAppearance();
      }
      if (event.target.matches('#local-endpoint,#peer-endpoint,#active-peer')) {
        const m = currentModel(); state.connectionDraft = state.connectionDraft || {...m.connection};
        state.connectionDraft.localEndpoint = document.getElementById('local-endpoint')?.value || '';
        state.connectionDraft.peerEndpoint = document.getElementById('peer-endpoint')?.value || '';
        state.connectionDraft.activePeer = document.getElementById('active-peer')?.value || '';
      }
    });
    document.addEventListener('keydown', event => {
      if(event.target.id!=='screenshot-shortcut'||!(event.ctrlKey||event.altKey)||event.metaKey)return;
      const key=/^Key[A-Z]$/.test(event.code)?event.code.slice(3):/^F([1-9]|10|11)$/.test(event.key)?event.key:null;
      if(!key)return;event.preventDefault();event.stopPropagation();
      event.target.value=[event.ctrlKey?'Ctrl':null,event.altKey?'Alt':null,event.shiftKey?'Shift':null,key].filter(Boolean).join('+');
    });
    document.addEventListener('change', event => {
      if (event.target.id === 'corner-range') {
        const pixels = Number(event.target.value);
        currentModel().cross.cornerGuardPixels = pixels;
        send({action:'set-corner-pixels',pixels});
      }
      if (event.target.id === 'ui-language') { currentModel().language = event.target.value; send({action:'set-language',language:event.target.value}); render(); }
      if (event.target.id === 'font-scale') {
        const value = Math.round(clamp(event.target.value,50,125) / 5) * 5;
        currentModel().fontScale = value;
        send({action:'set-font-scale',value});
        if (window.chrome?.webview) render();
      }
      if (event.target.id === 'history-limit') {
        const value = Math.round(clamp(event.target.value || currentModel().transfer.historyLimit,1,500));
        event.target.value = value;
        currentModel().transfer.historyLimit = value;
        send({action:'set-history-limit',value});
      }
    });
    document.addEventListener('keydown', event => {
      if (event.target.id === 'history-limit' && event.key === 'Enter') {
        event.preventDefault();
        event.target.blur();
      }
    });

    document.addEventListener('dragstart', event => {
      const peer = event.target.closest('[data-peer-drag]');
      if (!peer) return;
      if (peer.getAttribute('draggable') === 'false') { event.preventDefault(); return; }
      state.draggedPeer = peer.dataset.peerDrag;
      state.interacting = true;
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', state.draggedPeer);
    });
    document.addEventListener('dragover', event => {
      const slot = event.target.closest('[data-layout-drop]');
      if (!slot || !state.draggedPeer) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      slot.classList.add('drag-over');
    });
    document.addEventListener('dragleave', event => event.target.closest('[data-layout-drop]')?.classList.remove('drag-over'));
    document.addEventListener('drop', event => {
      const slot = event.target.closest('[data-layout-drop]');
      if (!slot) return;
      event.preventDefault();
      const fingerprint = event.dataTransfer.getData('text/plain') || state.draggedPeer;
      slot.classList.remove('drag-over');
      const placement = slot.dataset.layoutDrop;
      const current = (currentModel().peers || []).find(peer => peer.current);
      const unchanged = current?.fingerprint === fingerprint && currentModel().cross.placement === placement;
      if (fingerprint && !unchanged) {
        beginPendingLayout(fingerprint, placement);
        render();
        send({action:'set-layout',fingerprint,placement});
      }
      state.draggedPeer = '';
      state.interacting = false;
    });
    document.addEventListener('dragend', () => { state.draggedPeer = ''; state.interacting = false; document.querySelectorAll('.drag-over').forEach(node=>node.classList.remove('drag-over')); });
    document.addEventListener('submit', event => {
      if (event.target.id !== 'connection-form') return;
      event.preventDefault();
      const m = currentModel(), draft = state.connectionDraft || {...m.connection};
      draft.localEndpoint = document.getElementById('local-endpoint').value.trim();
      draft.peerEndpoint = document.getElementById('peer-endpoint').value.trim();
      draft.activePeer = document.getElementById('active-peer').value;
      send({action:'save-connection',activePeer:draft.activePeer,localEndpoint:draft.localEndpoint,peerEndpoint:draft.peerEndpoint,autoReceive:draft.autoReceive});
    });

    /*__BOUNDARY_EDITOR_JS__*/
    /*__SSH_JS__*/
    /*__LICENSE_JS__*/
    window.addEventListener('message', event => {
      if (!event.data || typeof event.data !== 'object') return;
      if (event.data.type === 'model') {
        if (pendingLayoutMatches(event.data)) clearPendingLayout();
        acceptBoundaryModel(event.data);
        recordStatusTelemetry(event.data);
        state.model = event.data;
        const sshState=event.data.ssh;
        let forceSshRender=false,sshTestSucceeded=false;
        if (state.sshSubmitting && sshState && (sshState.busy || sshState.operation)) state.sshSubmitting='';
        if (state.sshPendingTest && sshState) {
          const pendingTest=state.sshPendingTest;
          if (sshState.busy && sshState.operation==='test') pendingTest.started=true;
          const tested=Number(sshState.data?.outgoing?.find(connection=>connection.id===pendingTest.id)?.tested||0);
          if (!sshState.busy && sshState.operation==='test' && !sshState.error && tested>pendingTest.previousTested) {
            state.sshPendingTest=null;
            forceSshRender=true;
            sshTestSucceeded=true;
          } else if (!sshState.busy && pendingTest.started && sshState.operation==='test' && sshState.error) state.sshPendingTest=null;
        }
        if (state.sshReturnReview && sshState && !sshState.busy && sshLocalConfigured(sshState.server)) {
          state.modal={type:'ssh-review',id:state.sshReturnReview};state.sshReturnReview='';
          forceSshRender=true;
        }
        if (state.sshWaitingPeer) {
          const c=sshOut(state.sshWaitingPeer);
          if(c && sshActive(c.status)){state.modal={type:'ssh-waiting',id:c.id};state.sshWaitingPeer='';}
        }
        applyAppearance();
        if (forceSshRender) render();
        else if (shouldDeferModelRender()) state.modelDirty = true;
        else render();
        if (sshTestSucceeded) showToast(sshText('SSH 连接测试成功','SSH connection test succeeded'),{placement:'top',tone:'success',duration:2600});
      } else if (event.data.type === 'navigate') navigate(event.data.page);
      else if (event.data.type === 'boundary-graph-state') {
        const editor=boundaryV3State(),positions=event.data.positions&&typeof event.data.positions==='object'?event.data.positions:{};
        editor.graphStoredPositions=positions;
        if(!editor.graphDrag){editor.graphPositions=boundaryV3GraphPositions();editor.graphAnchors=Object.fromEntries(Object.entries(editor.graphPositions).map(([id,point])=>[id,{x:point.x,y:point.y}]));editor.graphVelocity={};if(state.page==='cross'&&editor.view==='boundary')render();}
      }
      else if (event.data.type === 'boundary-save-result') {
        const changed = event.data.success ? boundarySaveSucceeded() : boundarySaveFailed();
        if (changed) render();
        showToast(event.data.message, event.data.success ? {tone:'success'} : {});
      }
      else if (event.data.type === 'toast') {
        if (String(event.data.message || '').startsWith('操作未完成：')) {
          const layoutCleared = clearPendingLayout();
          const boundaryCleared = boundarySaveFailed();
          if (layoutCleared || boundaryCleared) render();
        }
        showToast(event.data.message);
      }
    });
    if (window.chrome?.webview) {
      window.chrome.webview.addEventListener('message', event => window.dispatchEvent(new MessageEvent('message',{data:event.data})));
      window.chrome.webview.postMessage({action:'ready'});
    } else {
      state.model = structuredClone(demoModel);
      recordStatusTelemetry(state.model);
      const requested = new URLSearchParams(location.search).get('page');
      if (requested && visiblePages().some(([key]) => key === requested)) state.page = requested;
      render();
    }

    async function copyText(value) {
      try {
        await navigator.clipboard.writeText(value);
      } catch (_) {
        const area = document.createElement('textarea'); area.value = value; area.style.position = 'fixed'; area.style.opacity = '0'; document.body.append(area); area.select(); document.execCommand('copy'); area.remove();
      }
      showToast(currentModel().language === 'en' ? 'Device code copied' : '完整设备码已复制');
    }
  </script>
</body>
</html>
