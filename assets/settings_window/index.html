<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pierdesk 设置</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f5f7fa;
      --surface: #fff;
      --surface-raised: #fbfcfe;
      --border: #e2e7ef;
      --border-strong: #d2d9e4;
      --text: #172033;
      --muted: #697386;
      --subtle: #8993a4;
      --blue: #1769e8;
      --blue-hover: #0d5fdc;
      --blue-soft: #eaf2ff;
      --green: #16845b;
      --green-soft: #e8f7f0;
      --amber: #a76005;
      --amber-soft: #fff3dc;
      --red: #cf3f4e;
      --red-soft: #fff0f1;
      --shadow: 0 8px 24px rgba(22, 40, 72, .055);
      --radius: 12px;
      --topbar: 72px;
      --sidebar: 288px;
      --font-scale: 1;
      --topbar-bg: rgba(255, 255, 255, .97);
      --sidebar-bg: rgba(255, 255, 255, .62);
      --control-hover: #eef1f5;
      --nav-text: #303a4c;
      --nav-hover: #eef3fa;
      --chip-bg: #eef1f5;
      --button-hover: #f7f9fc;
      --slot-bg: #fbfdff;
      --slot-border: #b9c9df;
      --peer-bg: #e9f8f3;
      --peer-border: #32a987;
      --peer-text: #126b58;
      --track: #e5e9ef;
      --story-text: #354052;
      font-family: "Segoe UI Variable", "Microsoft YaHei UI", "Segoe UI", sans-serif;
      font-size: 16px;
      background: var(--canvas);
      color: var(--text);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --canvas: #10141c;
      --surface: #191f2a;
      --surface-raised: #202733;
      --border: #2d3645;
      --border-strong: #3a4658;
      --text: #edf2fa;
      --muted: #aab4c5;
      --subtle: #7f8ba0;
      --blue: #68a4ff;
      --blue-hover: #5598fb;
      --blue-soft: #172c49;
      --green: #58d5ad;
      --green-soft: #17362f;
      --amber: #f1b65d;
      --amber-soft: #3d2c16;
      --red: #ff8792;
      --red-soft: #422229;
      --shadow: 0 10px 28px rgba(0, 0, 0, .22);
      --topbar-bg: rgba(20, 25, 34, .97);
      --sidebar-bg: rgba(22, 28, 38, .82);
      --control-hover: #28313f;
      --nav-text: #cdd5e2;
      --nav-hover: #232c3a;
      --chip-bg: #293240;
      --button-hover: #242d3a;
      --slot-bg: #171d27;
      --slot-border: #43546d;
      --peer-bg: #17352f;
      --peer-border: #51c9a6;
      --peer-text: #8ce4c9;
      --track: #313a48;
      --story-text: #d6deea;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--canvas); }
    body { font-size: calc(16px * var(--font-scale)); }
    button, input, select { font: inherit; }
    button, select, input[type="range"] { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid rgba(23, 105, 232, .22);
      outline-offset: 2px;
    }

    .app { height: 100vh; min-height: 100vh; display: grid; grid-template: var(--topbar) minmax(0, 1fr) / var(--sidebar) minmax(0, 1fr); }
    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 22px 0 26px;
      border-bottom: 1px solid var(--border);
      background: var(--topbar-bg);
      user-select: none;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand img { width: 34px; height: 34px; padding: 4px; border-radius: 7px; object-fit: contain; background: #0b69c8; }
    .brand strong { font-size: calc(21px * var(--font-scale)); font-weight: 680; letter-spacing: -.02em; }
    .top-actions { display: flex; align-items: center; gap: 14px; }
    .appearance-toggle {
      height: 38px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      background: var(--surface-raised);
    }
    .appearance-toggle:hover { color: var(--text); background: var(--button-hover); }
    .connection-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 38px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-raised);
      color: var(--muted);
      white-space: nowrap;
    }
    .window-controls { display: flex; gap: 4px; }
    .window-button { width: 42px; height: 38px; border: 0; border-radius: 7px; color: var(--text); background: transparent; }
    .window-button:hover { background: var(--control-hover); }
    .window-button.close:hover { color: white; background: #c42b1c; }

    .sidebar {
      min-width: 0;
      height: calc(100vh - var(--topbar));
      min-height: calc(100vh - var(--topbar));
      align-self: stretch;
      padding: 26px 12px;
      overflow: auto;
      border-right: 1px solid var(--border);
      background: var(--sidebar-bg);
    }
    .nav { display: grid; gap: 6px; }
    .nav-button {
      position: relative;
      width: 100%;
      min-height: 58px;
      padding: 0 18px;
      border: 0;
      border-radius: 9px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: transparent;
      color: var(--nav-text);
      text-align: left;
    }
    .nav-button:hover { background: var(--nav-hover); }
    .nav-button.active { color: var(--blue); background: var(--blue-soft); font-weight: 650; }
    .nav-button.active::before { content: ""; position: absolute; left: 0; top: 13px; bottom: 13px; width: 3px; border-radius: 3px; background: var(--blue); }
    .nav-icon { width: 23px; height: 23px; flex: 0 0 auto; }

    .content { min-width: 0; overflow: auto; padding: 30px 36px 44px; }
    .page { width: 100%; max-width: 1240px; margin: 0 auto; }
    .page-heading { margin: 0 0 22px; }
    h1 { margin: 0; font-size: calc(32px * var(--font-scale)); line-height: 1.2; letter-spacing: -.025em; font-weight: 700; }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: calc(15px * var(--font-scale)); }
    h2 { margin: 0; font-size: calc(20px * var(--font-scale)); line-height: 1.3; font-weight: 680; }
    h3 { margin: 0; font-size: calc(17px * var(--font-scale)); line-height: 1.35; font-weight: 670; }
    p { line-height: 1.65; }
    .section-title { margin: 24px 0 12px; display: flex; align-items: center; gap: 12px; }

    .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .card-pad { padding: 22px 24px; }
    .row { display: flex; align-items: center; gap: 14px; }
    .between { justify-content: space-between; }
    .stack { display: grid; gap: 12px; }
    .muted { color: var(--muted); }
    .subtle { color: var(--subtle); }
    .small { font-size: calc(13px * var(--font-scale)); }
    .mono { font-family: "Cascadia Mono", "Consolas", monospace; font-variant-numeric: tabular-nums; }
    .divider { height: 1px; background: var(--border); }
    .dot { width: 10px; height: 10px; flex: 0 0 auto; border-radius: 50%; background: var(--subtle); }
    .dot.green { background: #22b43a; box-shadow: 0 0 0 4px rgba(34, 180, 58, .08); }
    .chip { display: inline-flex; align-items: center; min-height: 25px; padding: 2px 9px; border-radius: 6px; color: var(--muted); background: var(--chip-bg); font-size: calc(12px * var(--font-scale)); font-weight: 650; }
    .chip.green { color: var(--green); background: var(--green-soft); }
    .chip.blue { color: var(--blue); background: var(--blue-soft); }
    .chip.amber { color: var(--amber); background: var(--amber-soft); }
    .chip.red { color: var(--red); background: var(--red-soft); }

    .button { min-height: 38px; padding: 8px 15px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 620; }
    .button:hover:not(:disabled) { border-color: var(--border-strong); background: var(--button-hover); }
    .button.primary { color: white; border-color: var(--blue); background: var(--blue); }
    .button.primary:hover:not(:disabled) { background: var(--blue-hover); }
    .button.danger { color: var(--red); border-color: #ef9aa3; }
    .button.ghost { border-color: transparent; background: transparent; color: var(--blue); }
    .button:disabled { cursor: default; opacity: .46; }
    .link-button { padding: 0; border: 0; color: var(--blue); background: transparent; text-align: left; }
    .link-button:hover { text-decoration: underline; }
    .icon { width: 20px; height: 20px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .icon.large { width: 30px; height: 30px; }

    .switch { position: relative; width: 52px; height: 30px; flex: 0 0 auto; border: 0; border-radius: 999px; padding: 0; background: #aeb4bd; transition: background 130ms ease; }
    .switch::after { content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; border-radius: 50%; background: white; box-shadow: 0 1px 4px rgba(0,0,0,.22); transition: transform 130ms ease; }
    .switch.on { background: var(--blue); }
    .switch.on::after { transform: translateX(22px); }
    .switch:disabled { cursor: default; opacity: .55; }
    .pair-switch-card { margin: 16px 0 28px; padding: 4px 22px; }
    .pair-switch-head { display: grid; gap: 4px; padding: 16px 0 10px; }
    .pair-switch-head h2 { margin: 0; font-size: calc(16px * var(--font-scale)); }
    .pair-switch-head p { margin: 0; }
    .pair-switch-row { min-height: 68px; padding: 14px 0; }
    .pair-switch-row .setting-label { flex: 1; min-width: 0; }

    .input, .select { width: 100%; min-height: 44px; border: 1px solid var(--border-strong); border-radius: 7px; padding: 9px 12px; color: var(--text); background: var(--surface); }
    .input:focus, .select:focus { border-color: var(--blue); outline: 3px solid rgba(23,105,232,.12); }
    input[type="range"] { width: 100%; accent-color: var(--blue); }

    .status-hero { overflow: hidden; }
    .workspace-summary { padding: 24px; display: grid; grid-template-columns: minmax(240px, .72fr) minmax(420px, 1.28fr); gap: 24px; }
    .local-summary { min-width: 0; padding: 4px 24px 4px 2px; border-right: 1px solid var(--border); display: grid; align-content: center; gap: 18px; }
    .local-identity { min-width: 0; display: grid; grid-template-columns: 62px minmax(0, 1fr); align-items: center; gap: 16px; }
    .local-monitor { width: 62px; height: 62px; border-radius: 16px; display: grid; place-items: center; color: var(--blue); background: var(--blue-soft); }
    .local-monitor .icon { width: 34px; height: 34px; }
    .local-copy { min-width: 0; display: grid; gap: 5px; }
    .local-copy strong { font-size: calc(18px * var(--font-scale)); }
    .fingerprint { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-size: calc(12px * var(--font-scale)); }
    .workspace-health { padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--surface-raised); }
    .workspace-health-copy { min-width: 0; display: grid; gap: 4px; }
    .workspace-health strong { font-size: calc(17px * var(--font-scale)); }
    .workspace-count { flex: 0 0 auto; color: var(--green); font-size: calc(26px * var(--font-scale)); font-weight: 720; letter-spacing: -.03em; }
    .workspace-count.failed { color: var(--red); }
    .peer-overview { min-width: 0; display: grid; align-content: start; gap: 12px; }
    .peer-overview-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .peer-overview-list { display: grid; gap: 9px; }
    .peer-overview-row { min-width: 0; min-height: 72px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; display: grid; grid-template-columns: minmax(150px, 1.2fr) minmax(130px, .9fr) auto; align-items: center; gap: 14px; background: var(--surface-raised); }
    .peer-overview-row.error { border-color: color-mix(in srgb, var(--red) 45%, var(--border)); background: var(--red-soft); }
    .peer-identity { min-width: 0; display: flex; align-items: center; gap: 12px; }
    .peer-monitor { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 10px; display: grid; place-items: center; color: var(--blue); background: var(--blue-soft); }
    .peer-monitor .icon { width: 23px; height: 23px; }
    .peer-copy, .peer-route { min-width: 0; display: grid; gap: 3px; }
    .peer-copy strong, .peer-route strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .peer-state { display: grid; justify-items: end; gap: 6px; white-space: nowrap; }
    .facts { padding: 16px 20px; border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-raised); }
    .fact { min-width: 0; padding: 0 18px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); text-align: center; }
    .fact + .fact { border-left: 1px solid var(--border); }
    .status-alert { margin-top: 14px; padding: 15px 18px; border: 1px solid color-mix(in srgb, var(--red) 48%, var(--border)); border-radius: var(--radius); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; color: var(--red); background: var(--red-soft); }
    .status-alert-copy { min-width: 0; display: grid; gap: 3px; }
    .status-alert-copy span { overflow-wrap: anywhere; }
    .status-notice { margin-top: 14px; padding: 15px 18px; border: 1px solid color-mix(in srgb, var(--amber) 48%, var(--border)); border-radius: var(--radius); display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 14px; color: var(--amber); background: var(--amber-soft); }
    .status-notice-copy { min-width: 0; display: grid; gap: 3px; }
    .status-notice-copy span { overflow-wrap: anywhere; }
    .telemetry-card { margin-top: 14px; overflow: hidden; }
    .telemetry-head { padding: 18px 20px 14px; display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .telemetry-title { display: grid; gap: 4px; }
    .telemetry-title h2 { display: flex; align-items: center; gap: 9px; }
    .telemetry-live { display: inline-flex; align-items: center; gap: 7px; color: var(--green); font-size: calc(12px * var(--font-scale)); font-weight: 680; }
    .telemetry-live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 12%, transparent); }
    .telemetry-layout { padding: 0 20px 20px; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(290px, .8fr); gap: 16px; }
    .latency-panel, .activity-panel { min-width: 0; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-raised); }
    .latency-panel { padding: 14px 14px 12px; }
    .latency-legend { min-height: 42px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
    .latency-legend-item { min-width: 0; display: flex; align-items: center; gap: 8px; font-size: calc(12px * var(--font-scale)); }
    .latency-swatch { width: 18px; height: 3px; flex: 0 0 auto; border-radius: 999px; background: var(--series-color); box-shadow: 0 0 8px color-mix(in srgb, var(--series-color) 45%, transparent); }
    .latency-legend-item strong { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .latency-current { color: var(--series-color); font-variant-numeric: tabular-nums; font-weight: 720; }
    .latency-chart { width: 100%; height: 244px; display: block; overflow: visible; }
    .chart-grid { stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .chart-threshold { stroke: color-mix(in srgb, var(--amber) 38%, var(--border)); stroke-width: 1; stroke-dasharray: 5 6; vector-effect: non-scaling-stroke; }
    .chart-axis-label { fill: var(--subtle); font-size: 10px; font-family: "Cascadia Mono", "Consolas", monospace; }
    .chart-line { fill: none; stroke: var(--series-color); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 3px color-mix(in srgb, var(--series-color) 30%, transparent)); }
    .chart-point { fill: var(--surface-raised); stroke: var(--series-color); stroke-width: 2; vector-effect: non-scaling-stroke; }
    .latency-empty { height: 244px; display: grid; place-items: center; color: var(--muted); text-align: center; }
    .latency-stats { margin-top: 8px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
    .latency-stat { min-width: 0; padding: 10px 11px; border: 1px solid var(--border); border-radius: 8px; display: grid; grid-template-columns: auto 1fr; gap: 5px 9px; background: var(--surface); }
    .latency-stat .latency-swatch { margin-top: 7px; }
    .latency-stat-copy { min-width: 0; display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; }
    .latency-stat-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: calc(12px * var(--font-scale)); }
    .latency-stat-copy span { color: var(--muted); font-size: calc(11px * var(--font-scale)); font-variant-numeric: tabular-nums; }
    .activity-panel { padding: 14px; display: grid; align-content: start; gap: 10px; }
    .activity-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .activity-lane { padding: 12px; border: 1px solid var(--border); border-radius: 9px; display: grid; gap: 9px; background: var(--surface); }
    .activity-lane-head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 9px; }
    .activity-icon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--lane-color); background: color-mix(in srgb, var(--lane-color) 12%, transparent); }
    .activity-icon .icon { width: 18px; height: 18px; }
    .activity-copy { min-width: 0; display: grid; gap: 2px; }
    .activity-copy strong, .activity-copy span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .activity-count { color: var(--lane-color); font-size: calc(18px * var(--font-scale)); font-weight: 730; font-variant-numeric: tabular-nums; }
    .activity-track { position: relative; height: 18px; border-radius: 999px; overflow: hidden; background: var(--chip-bg); }
    .activity-track::before { content: ""; position: absolute; inset: 8px 0 auto; height: 2px; background: color-mix(in srgb, var(--lane-color) 24%, var(--border)); }
    .activity-pulse { position: absolute; top: 4px; width: 10px; height: 10px; margin-left: -5px; border: 2px solid var(--surface); border-radius: 50%; background: var(--lane-color); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lane-color) 15%, transparent); }
    .activity-progress { height: 6px; border-radius: 999px; overflow: hidden; background: var(--chip-bg); }
    .activity-progress > span { display: block; height: 100%; border-radius: inherit; background: var(--lane-color); }
    .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .status-card { min-height: 126px; padding: 18px; display: flex; align-items: center; gap: 16px; }
    .round-icon { width: 54px; height: 54px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; color: var(--blue); background: var(--blue-soft); }
    .round-icon.green { color: var(--green); background: var(--green-soft); }
    .round-icon.amber { color: var(--amber); background: var(--amber-soft); }
    .round-icon.purple { color: #6f42d9; background: #f0eaff; }
    .status-copy { min-width: 0; display: grid; gap: 5px; }
    .status-copy strong { font-size: calc(16px * var(--font-scale)); }
    .status-copy span { overflow-wrap: anywhere; }

    .steps { padding: 22px 36px; display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 22px; }
    .step { display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 650; }
    .step-number { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: white; background: var(--blue); font-size: calc(13px * var(--font-scale)); }
    .step-arrow { color: var(--subtle); }
    .security-note { padding: 14px 36px; border-top: 1px solid var(--border); color: var(--muted); font-size: calc(13px * var(--font-scale)); }
    .device-list { display: grid; gap: 12px; }
    .device-card { min-height: 116px; padding: 18px 20px; display: grid; grid-template-columns: minmax(220px, 1.4fr) minmax(180px, 1fr) auto; align-items: center; gap: 18px; }
    .device-title { display: flex; align-items: center; gap: 10px; }
    .device-meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: calc(13px * var(--font-scale)); }
    .device-code { display: inline-flex; align-items: center; gap: 7px; max-width: 250px; }
    .device-code code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .copy-code { width: 28px; height: 28px; flex: 0 0 auto; padding: 0; border: 0; border-radius: 6px; color: var(--muted); background: transparent; }
    .copy-code:hover { color: var(--blue); background: var(--blue-soft); }
    .device-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
    .verification { display: grid; justify-items: center; gap: 5px; padding: 14px 18px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-raised); }
    .verification-code { color: var(--blue); font-size: calc(32px * var(--font-scale)); font-weight: 720; letter-spacing: .18em; font-variant-numeric: tabular-nums; }

    .cross-toolbar { display: grid; grid-template-columns: 1fr auto; gap: 14px; }
    .toolbar-status, .toolbar-actions { padding: 14px 18px; min-height: 58px; }
    .toolbar-actions { display: flex; align-items: center; gap: 8px; }
    .cross-grid { margin-top: 16px; display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; }
    .layout-card { padding: 20px; }
    .layout-workspace { margin-top: 16px; display: grid; grid-template-columns: minmax(420px, 1.5fr) minmax(230px, .7fr); gap: 16px; }

      return translated.split(' · ').map(translateKnownText).join(' · ');
    }

    function localizeDocument() {
      const language = currentModel().language || 'en';
      document.documentElement.lang = language;
      document.title = language === 'en' ? 'Pierdesk Settings' : 'Pierdesk 设置';
      if (language !== 'en') return;
      const root = document.getElementById('root');
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      for (let node = walker.nextNode(); node; node = walker.nextNode()) {
        const raw = node.nodeValue, trimmed = raw.trim();
        if (!trimmed) continue;
        const translated = translateText(trimmed);
        if (translated !== trimmed) node.nodeValue = raw.replace(trimmed, translated);
      }
      root.querySelectorAll('[aria-label],[title],[placeholder],[alt]').forEach(node => {
        for (const attribute of ['aria-label','title','placeholder','alt']) if (node.hasAttribute(attribute)) node.setAttribute(attribute, translateText(node.getAttribute(attribute)));

    }

    function shell(pageHtml) {
      const m = currentModel();
      const onlinePeerCount = (m.peers || []).filter(peer => peer.online).length;
      return `<div class="app">
        <header class="topbar" data-drag-region>
          <div class="brand"><img src="__PIERDESK_ICON__" alt=""><strong>Pierdesk 设置</strong></div>
          <div class="top-actions">

            </div>

        <main class="content"><section class="page">${sshNotice()}${pageHtml}</section></main>
      </div>${['top','right','bottom','left','top-left','top-right','bottom-left','bottom-right'].map(edge=>`<div class="resize-handle ${edge.includes('-')?'corner':''}" data-edge="${edge}" aria-hidden="true"></div>`).join('')}${state.modal ? renderModal(state.modal) : ''}`;
    }
    function heading(title, subtitle) { return `<div class="page-heading"><h1>${title}</h1><p class="subtitle">${subtitle}</p></div>`; }

    function statusBoundarySummary(model, fingerprint) {
      const workspace = model.boundaryWorkspaceV3;
      const layout = (model.boundaryWorkspaceV3Applied ? workspace?.applied?.layout : null) || workspace?.draft;
      const boundaries = (layout?.boundaries || []).filter(boundary => boundary.peerFingerprint === fingerprint);
      let position = '';
      const local = layout?.screens?.find(screen => screen.deviceFingerprint === layout.localFingerprint);
      const peer = layout?.screens?.find(screen => screen.deviceFingerprint === fingerprint);
      if (local && peer) {
        const size = screen => {
          const rotated = Number(screen.rotationQuarterTurns || 0) % 2 !== 0;
          return {
            width: Number(rotated ? screen.physicalHeightMillimeters : screen.physicalWidthMillimeters) || 0,
            height: Number(rotated ? screen.physicalWidthMillimeters : screen.physicalHeightMillimeters) || 0,
          };
        };
        const localSize = size(local), peerSize = size(peer);
        const dx = Number(peer.canvasXMillimeters || 0) + peerSize.width / 2 - Number(local.canvasXMillimeters || 0) - localSize.width / 2;
        const dy = Number(peer.canvasYMillimeters || 0) + peerSize.height / 2 - Number(local.canvasYMillimeters || 0) - localSize.height / 2;
        position = Math.abs(dx) >= Math.abs(dy) ? (dx < 0 ? '左侧' : '右侧') : (dy < 0 ? '上方' : '下方');
      }
      if (!boundaries.length) {
        const segments = (model.boundaryMap?.segments || []).filter(segment => segment.peerFingerprint === fingerprint);
        if (segments.length) {
          position = placementLabel(({top:'above',bottom:'below',left:'left',right:'right'})[segments[0].edge]);
          return `${position} · ${segments.length} 条边界`;
        }
        return '未加入边界工作区';
      }
      return `${position || '已加入布局'} · ${boundaries.length} 条边界`;
    }

    function statusPeerRows(model) {
      const links = Array.isArray(model.cross?.connections?.peers) ? model.cross.connections.peers : [];
      const linksByFingerprint = new Map(links.map(link => [link.fingerprint, link]));
      const appliedLayout = model.boundaryWorkspaceV3Applied ? model.boundaryWorkspaceV3?.applied?.layout : null;
      const workspaceIds = new Set((appliedLayout?.boundaries || []).map(boundary => boundary.peerFingerprint));
      const ids = links.length ? links.map(link => link.fingerprint) : workspaceIds.size ? [...workspaceIds] : (model.peers || []).filter(peer => peer.online || peer.current).map(peer => peer.fingerprint);
      return [...new Set(ids)].map(fingerprint => {
        const peer = (model.peers || []).find(candidate => candidate.fingerprint === fingerprint) || { fingerprint, label: fingerprint };
        const link = linksByFingerprint.get(fingerprint);
        const online = link ? Boolean(link.online) : Boolean(peer.online);
        const error = String(link?.lastError || '');
        const stateLabel = error ? '连接异常' : online ? '已连接' : peer.online ? '正在连接' : '离线';
        const latency = link?.roundTripMicros !== null && link?.roundTripMicros !== undefined && Number.isFinite(Number(link.roundTripMicros)) ? `${(Number(link.roundTripMicros) / 1000).toFixed(1)} ms` : '等待中';
        return { peer, link, online, error, stateLabel, latency, boundary:statusBoundarySummary(model, fingerprint) };
      });
    }

    const telemetryWindowMs = 90000;
    const telemetryPalette = ['#5d9df6','#42c79a','#b787f5','#f2a64a','#f16c7f'];
    function telemetryText(zh, enText) { return currentModel().language === 'en' ? enText : zh; }
    function recordStatusTelemetry(model, now = Date.now()) {
      const telemetry = state.telemetry;
      const connections = Array.isArray(model.cross?.connections?.peers) ? model.cross.connections.peers : [];
      const peers = model.peers || [];
      if (!telemetry.lastSampleAt || now - telemetry.lastSampleAt >= 450) {
        connections.forEach((link, index) => {
          const fingerprint = String(link.fingerprint || `peer-${index}`);
          const peer = peers.find(item => item.fingerprint === fingerprint);
          const series = telemetry.links[fingerprint] || (telemetry.links[fingerprint] = { fingerprint, label: peer?.label || fingerprint, color: telemetryPalette[Object.keys(telemetry.links).length % telemetryPalette.length], samples: [] });
          series.label = peer?.label || series.label;
          const hasLatency = link.roundTripMicros !== null && link.roundTripMicros !== undefined;
          const micros = Number(link.roundTripMicros);
          series.samples.push({ at: now, value: link.online && hasLatency && Number.isFinite(micros) ? micros / 1000 : null });
          series.samples = series.samples.filter(sample => sample.at >= now - telemetryWindowMs).slice(-190);
        });
        telemetry.lastSampleAt = now;
      }
      const rememberEvent = (kind, generation, detail) => {
        if (!Number.isFinite(generation)) return;
        const key = kind === 'clipboard' ? 'sharedGeneration' : 'transferGeneration';
        const previous = telemetry[key];
        if (previous !== null && generation > previous) telemetry.events.push({ at: now, kind, count: Math.max(1, generation - previous), detail });
        telemetry[key] = generation;
      };
      rememberEvent('clipboard', Number(model.shared?.generation), [model.shared?.lastDirection, model.shared?.lastFormats, model.shared?.lastBytes].filter(Boolean).join(' · '));
      rememberEvent('transfer', Number(model.transfer?.generation), model.transfer?.tasks?.[0]?.name || model.recentManifest?.name || '');
      const crossSignature = connections.map(link => `${link.fingerprint}:${Boolean(link.online)}:${link.lastError || ''}`).sort().join('|');
      if (telemetry.crossSignature !== undefined && telemetry.crossSignature !== crossSignature) telemetry.events.push({ at: now, kind: 'cross', count: 1, detail: model.cross?.state || '' });
      telemetry.crossSignature = crossSignature;
      telemetry.events = telemetry.events.filter(event => event.at >= now - telemetryWindowMs).slice(-80);
    }
    function percentile(values, ratio) {
      if (!values.length) return null;
      const sorted = [...values].sort((a,b) => a-b);
      return sorted[Math.min(sorted.length - 1, Math.max(0, Math.ceil(sorted.length * ratio) - 1))];
    }
    function latencyTelemetryMarkup(peerRows) {
      const now = Date.now(), start = now - telemetryWindowMs;
      const visible = peerRows.map((row, index) => {
        const series = state.telemetry.links[row.peer.fingerprint] || { fingerprint:row.peer.fingerprint, label:row.peer.label || row.peer.fingerprint, color:telemetryPalette[index % telemetryPalette.length], samples:[] };
        const samples = series.samples.filter(sample => sample.at >= start);
        return {...series, samples, values:samples.map(sample => sample.value).filter(Number.isFinite)};
      });
      const allValues = visible.flatMap(series => series.values);
      const yMax = Math.max(20, Math.ceil((Math.max(0, ...allValues) + 4) / 10) * 10);
      const plot = { left:52, top:12, width:690, height:170 };
      const x = at => plot.left + clamp((at - start) / telemetryWindowMs, 0, 1) * plot.width;
      const y = value => plot.top + plot.height - clamp(value / yMax, 0, 1) * plot.height;
      const horizontal = [0, .5, 1].map(ratio => `<line class="chart-grid" x1="${plot.left}" y1="${plot.top + plot.height * ratio}" x2="${plot.left + plot.width}" y2="${plot.top + plot.height * ratio}"/><text class="chart-axis-label" x="${plot.left - 8}" y="${plot.top + plot.height * ratio + 4}" text-anchor="end">${Math.round(yMax * (1-ratio))}</text>`).join('');
      const vertical = [0,.25,.5,.75,1].map(ratio => `<line class="chart-grid" x1="${plot.left + plot.width * ratio}" y1="${plot.top}" x2="${plot.left + plot.width * ratio}" y2="${plot.top + plot.height}"/>`).join('');
      const threshold = yMax >= 50 ? `<line class="chart-threshold" x1="${plot.left}" y1="${y(50)}" x2="${plot.left + plot.width}" y2="${y(50)}"/><text class="chart-axis-label" x="${plot.left + plot.width - 4}" y="${y(50) - 6}" text-anchor="end">50 ms</text>` : '';
      const paths = visible.map(series => {
        const segments = []; let current = [];
        series.samples.forEach(sample => { if (Number.isFinite(sample.value)) current.push(sample); else if (current.length) { segments.push(current); current=[]; } });
        if (current.length) segments.push(current);
        return `<g style="--series-color:${series.color}">${segments.map(segment => {
          if (segment.length === 1) return `<circle class="chart-point" cx="${x(segment[0].at).toFixed(1)}" cy="${y(segment[0].value).toFixed(1)}" r="3.4"/>`;
          return `<path class="chart-line" d="${segment.map((sample, i) => `${i?'L':'M'}${x(sample.at).toFixed(1)},${y(sample.value).toFixed(1)}`).join(' ')}"/>`;
        }).join('')}</g>`;
      }).join('');
      const legend = visible.map(series => `<span class="latency-legend-item" style="--series-color:${series.color}"><span class="latency-swatch"></span><strong>${escapeHtml(series.label)}</strong><span class="latency-current">${series.values.length ? `${series.values.at(-1).toFixed(1)} ms` : '—'}</span></span>`).join('');
      const stats = visible.map(series => {
        const current = series.values.at(-1), p95 = percentile(series.values,.95), peak = series.values.length ? Math.max(...series.values) : null;
        const metrics = current === undefined ? telemetryText('等待样本','Waiting for samples') : telemetryText(`当前 ${current.toFixed(1)} · P95 ${p95.toFixed(1)} · 峰值 ${peak.toFixed(1)} ms`,`Now ${current.toFixed(1)} · P95 ${p95.toFixed(1)} · Peak ${peak.toFixed(1)} ms`);
        return `<div class="latency-stat" style="--series-color:${series.color}"><span class="latency-swatch"></span><div class="latency-stat-copy"><strong>${escapeHtml(series.label)}</strong><span>${escapeHtml(metrics)}</span></div></div>`;
      }).join('');
      return `<section class="latency-panel"><div class="latency-legend">${legend || `<span class="muted small">${telemetryText('暂无已连接设备','No connected devices')}</span>`}</div>${allValues.length ? `<svg class="latency-chart" viewBox="0 0 760 205" role="img" aria-label="${telemetryText('设备延迟实时折线图','Live device latency chart')}">${horizontal}${vertical}${threshold}${paths}<text class="chart-axis-label" x="${plot.left}" y="202">−90 s</text><text class="chart-axis-label" x="${plot.left + plot.width}" y="202" text-anchor="end">${telemetryText('现在','Now')}</text><text class="chart-axis-label" x="10" y="12">ms</text></svg>` : `<div class="latency-empty">${telemetryText('正在收集延迟样本…','Collecting latency samples…')}</div>`}<div class="latency-stats">${stats}</div></section>`;
    }
    function activityTrack(kind, color) {
      const now = Date.now(), start = now - telemetryWindowMs;
      return `<div class="activity-track" style="--lane-color:${color}">${state.telemetry.events.filter(event => event.kind === kind).map(event => `<span class="activity-pulse" style="left:${clamp((event.at-start)/telemetryWindowMs*100,0,100).toFixed(1)}%" title="${escapeHtml(event.detail || '')}"></span>`).join('')}</div>`;
    }
    function activityTelemetryMarkup(model, peerRows) {
      const withinWindow = kind => state.telemetry.events.filter(event => event.kind === kind).reduce((sum,event) => sum + event.count, 0);

      const tasks = model.transfer?.tasks || [], task = tasks[0], transferDetail = task ? `${task.name} · ${Number(task.progress || 0).toFixed(1)}% · ${task.speed}` : telemetryText('当前没有传输','No active transfer');

    }

    function renderStatus() {

      return heading('状态总览', 'Pierdesk 正在后台运行') + `

        ${m.lastNotice ? `<aside class="status-notice" role="status">${svg('info','large')}<div class="status-notice-copy"><strong>控制提示</strong><span>${escapeHtml(m.lastNotice)}</span></div></aside>` : ''}
        <article class="card telemetry-card"><div class="telemetry-head"><div class="telemetry-title"><h2>${svg('globe')}实时链路</h2><span class="muted small">逐台设备显示真实 TLS 心跳往返延迟</span></div><span class="telemetry-live">实时更新 · 最近 90 秒</span></div><div class="telemetry-layout">${latencyTelemetryMarkup(peerRows)}${activityTelemetryMarkup(m,peerRows)}</div></article>

    function autostartDetail(m) {

    function statusCard(title, primary, secondary, ico, color='', healthy = !['不可用','未开启','未运行','Unavailable','Disabled','Not running'].includes(primary)) {
      return `<article class="card status-card"><span class="round-icon ${color}">${svg(ico,'large')}</span><div class="status-copy"><strong>${escapeHtml(title)}</strong><span><span class="dot ${healthy ? 'green' : ''}" style="display:inline-block;margin-right:8px"></span>${escapeHtml(primary)}</span><span class="muted small">${escapeHtml(secondary)}</span></div></article>`;
    }

    function renderDevices() {
      const m = currentModel();
      const pairing = m.pairing;
      const discovered = m.discovered || [];
      const peers = m.peers || [];
      return heading('设备与配对', '发现并管理同一局域网中的可信设备') + `
        <article class="card"><div class="steps"><div class="step">${svg('monitor','large')}<span class="step-number">1</span>发现设备</div><span class="step-arrow">→</span><div class="step">${svg('shield','large')}<span class="step-number">2</span>核对验证码</div><span class="step-arrow">→</span><div class="step">${svg('screens','large')}<span class="step-number">3</span>完成配对</div></div><div class="security-note">${svg('shield')}只有两台电脑显示的验证码一致时才允许配对</div></article>
        ${m.pairingMessage ? `<div class="validation" style="margin-top:14px">${svg('info')} ${escapeHtml(pairingMessageText(m.pairingMessage))}</div>` : ''}
        <div class="section-title"><h2>发现的新设备</h2><span class="row small" style="color:var(--green)"><span class="dot green"></span>${m.discovery.running ? '正在扫描局域网' : '发现服务不可用'}</span></div>
        <div class="device-list">${discovered.length ? discovered.map(device => discoveredCard(device, pairing)).join('') : `<article class="card empty">暂未发现可配对的新设备。请确认另一台电脑已打开 Pierdesk 并位于同一局域网。</article>`}</div>
        <div class="section-title"><h2>已配对设备</h2><span class="muted small">${peers.length} 台可信设备 · 可同时保留并加入跨屏工作区</span></div>
        <div class="device-list">${peers.length ? peers.map(peer => pairedCard(peer)).join('') : `<article class="card empty">当前没有已配对设备。</article>`}</div>
        <p class="muted small">${svg('info')} 取消配对后，需要重新核对验证码才能连接。</p>`;
    }
    function discoveredCard(device, pairing) {
      const active = pairing && pairing.fingerprint === device.fingerprint;
      return `<article class="card device-card"><div><div class="device-title">${svg('monitor','large')}<h3>${escapeHtml(device.label)}</h3>${chip('可配对','green')}</div><div class="device-meta"><span>${svg('globe')} ${escapeHtml(device.address)}</span><span class="mono">${escapeHtml(device.fingerprint)}</span></div></div>${active ? `<div class="verification"><span class="muted small">双端验证码</span><strong class="verification-code">${escapeHtml(pairing.code)}</strong><span class="muted small">请在两台电脑上核对</span></div><div class="stack"><button class="button primary" data-action="approve-pairing">允许配对</button><button class="button" data-action="reject-pairing">拒绝</button></div>` : `<div class="muted small">通过局域网发现<br>配对后保存双向 TLS 身份</div><button class="button primary" data-action="pair" data-fingerprint="${escapeHtml(device.fingerprint)}">开始配对</button>`}</article>`;
    }
    function pairedCard(peer) {
      const code = compactFingerprint(peer.fingerprint);
      const screen = peer.screen || {}, screenReady = Number(screen.pixelWidth) > 1 && Number(screen.pixelHeight) > 1 && Number(screen.physicalWidthMillimeters) > 0 && Number(screen.physicalHeightMillimeters) > 0;
      const screenState = screenReady ? `屏幕信息已同步 · ${screen.pixelWidth}×${screen.pixelHeight} · ${screen.physicalWidthMillimeters}×${screen.physicalHeightMillimeters} mm` : peer.online ? '屏幕信息同步中' : '等待设备上线后同步屏幕信息';
      return `<article class="card device-card"><div><div class="device-title">${svg('monitor','large')}<h3>${escapeHtml(peer.label)}</h3>${chip(peer.online ? '在线':'离线',peer.online?'green':'')}</div><div class="device-meta"><span class="device-code" title="${escapeHtml(peer.fingerprint)}"><code class="mono">${escapeHtml(code)}</code><button class="copy-code" data-copy="${escapeHtml(peer.fingerprint)}" aria-label="复制完整设备码" title="复制完整设备码">${svg('file')}</button></span><span>${escapeHtml(peer.endpoint || '地址等待发现')}</span></div></div><div class="stack small"><span>${svg('lock')} 双向 TLS 1.3</span><span>${svg('info')} ${screenState}</span></div><div class="device-actions"><button class="button ghost" data-ssh="go" data-peer="${escapeHtml(peer.fingerprint)}">${sshText('远程工作','Remote work')}</button><button class="button danger" data-confirm="revoke" data-fingerprint="${escapeHtml(peer.fingerprint)}" data-label="${escapeHtml(peer.label)}">取消配对</button></div></article>`;
    }

    function compactFingerprint(value) {
      const parts = String(value || '').split(':');
      return parts.length > 8 ? `${parts.slice(0,4).join(':')}…${parts.slice(-4).join(':')}` : String(value || '—');
    }

    function boundaryRuntimeSettingsMarkup(c) {
      return `<div class="boundary-advanced-settings"><div class="boundary-master row between"><div class="setting-label"><strong>使用已应用的边界范围</strong><span class="muted small">关闭后临时使用固定方向；正在编辑的草稿会保留</span></div>${switchButton(c.boundaryMapV2Enabled!==false,'toggle-boundary-map-v2','使用已应用的边界范围')}</div><div class="boundary-panel"><div class="boundary-master row between"><div class="setting-label"><strong>屏幕四角防误触</strong><span class="muted small">仅影响目前运行中的边界；新草稿会在最终应用时编译 32 像素保护</span></div>${switchButton(c.cornerGuardEnabled,'toggle-corner','屏幕四角防误触')}</div><div class="boundary-range"><div class="setting-label"><strong>四角保护范围</strong><span class="muted small">拖动范围 0–512 像素</span></div><input id="corner-range" type="range" min="0" max="512" value="${c.cornerGuardPixels}" aria-label="四角保护范围" ${c.cornerGuardEnabled?'':'disabled'}><output class="value-box" id="corner-output">${c.cornerGuardPixels} 像素</output></div><div class="boundary-options"><div class="boundary-option"><div class="setting-label"><strong>跨越前需要二次顶边</strong><span class="muted small">鼠标需要连续两次抵达屏幕边缘才会跨越</span></div>${switchButton(c.requireSecondPush,'toggle-second-push','跨越前需要二次顶边')}</div><div class="boundary-option"><div class="setting-label"><strong>全屏应用运行时暂停</strong><span class="muted small">检测到全屏应用时临时暂停跨屏功能</span></div>${switchButton(c.pauseOnFullscreen,'toggle-fullscreen','全屏应用运行时暂停')}</div><div class="boundary-option"><div class="setting-label"><strong>${sshText('保持链路热身（插电时）','Keep links warm (on AC power)')}</strong><span class="muted small">${sshText('使用中持续与对端保持较密的心跳，减少闲置后首次跨屏的卡顿；任一端用电池时自动停用','While in use, keep a denser heartbeat to peers to avoid stutter on the first crossing after idle; turns off automatically when either end is on battery')}</span></div>${switchButton(c.keepLinkWarm!==false,'toggle-keep-link-warm',sshText('保持链路热身（插电时）','Keep links warm (on AC power)'))}</div></div><div class="cursor-locator-tip">${svg('info')}<div class="setting-label"><strong>${sshText('快速定位鼠标','Find the pointer')}</strong><span class="muted small">${sshText('连续按两次右 Alt，光圈会迅速聚集到当前鼠标位置','Press Right Alt twice and rings will rapidly converge on the pointer')}</span></div><span class="shortcut-keys"><kbd>${sshText('右 Alt','Right Alt')}</kbd><b>× 2</b></span></div></div></div>`;
    }

    function pairSwitchRow(row, m, globalOff) {
      const english = m.language === 'en';
      const blocked = globalOff || !row.online;
      const status = !row.online ? (english ? 'Peer offline' : '对端离线') : row.enabled ? (english ? 'Cross-screen on' : '跨屏已开启') : (english ? 'Cross-screen off' : '跨屏已停用');
      const hint = globalOff ? (english ? 'Turn on cross-screen control first' : '请先开启跨屏控制') : !row.online ? (english ? 'Both computers must be online to switch' : '两台电脑需同时在线才能切换') : '';
      const label = escapeHtml(row.label);
      return `<div class="setting-row pair-switch-row"><span class="dot ${row.online ? 'green' : ''}"></span><div class="setting-label"><strong>${label}</strong><span class="muted small">${hint}</span></div>${chip(status, row.enabled && row.online ? 'green' : '')}<button class="switch ${row.enabled ? 'on' : ''}" role="switch" aria-checked="${row.enabled}" aria-label="${english ? 'Cross-screen control with ' : '与此设备的跨屏控制：'}${label}" data-action="toggle-pair" data-fingerprint="${escapeHtml(row.fingerprint)}" ${blocked ? 'disabled' : ''}></button></div>`;
    }
    function renderPairSwitches(m) {
      const rows = Array.isArray(m.pairSwitches) ? m.pairSwitches : [];
      if (!rows.length) return '';
      const english = m.language === 'en';
      const globalOff = !m.cross.enabled;
      return `<section class="card pair-switch-card"><div class="pair-switch-head"><h2>${english ? 'Device connections' : '设备连接'}</h2><p class="muted small">${english ? 'Turn cross-screen control on or off for one pair of computers. Boundary settings and pairing are not changed.' : '按电脑对单独开启或关闭跨屏控制。不会修改边界设置，也不会解除配对。'}</p></div>${rows.map(row => pairSwitchRow(row, m, globalOff)).join('')}</section>`;
    }

    function renderCross() {
      const m = currentModel(), c = m.cross;
      const canResume = ['已暂停','已锁定本机','失败'].includes(c.state);
      return heading('跨屏控制', '让鼠标和键盘自然跨越多台电脑') + `
        <div class="cross-toolbar"><article class="card toolbar-status row between"><div class="row"><span class="dot ${c.enabled ? 'green':''}"></span><strong>跨屏控制${escapeHtml(c.state)}</strong><span class="muted">延迟 ${escapeHtml(c.latency || '等待中')}</span></div>${switchButton(c.enabled,'toggle-cross','开启跨屏控制')}</article><article class="card toolbar-actions"><button class="button" data-action="return-local">${svg('external')}立即切回本机</button><button class="button" data-action="${canResume?'resume-cross':'pause-cross'}">${svg(canResume?'play':'lock')}${canResume?'恢复跨屏控制':'暂时锁定在本机'}</button></article></div>
        ${renderPairSwitches(m)}
        ${renderBoundaryEditor(m)}`;
    }

    function layoutSlot(position, current, cross, pending, peers) {
      const applying = pending && pending.placement === position;
      const occupied = !pending && current && cross.placement === position;
      const peer = applying ? peers.find(item => item.fingerprint === pending.fingerprint) : current;
      const content = applying
        ? `<span class="layout-applying-device">${svg('monitor','large')}<span class="applying-status"><span class="spinner"></span>正在应用布局…</span><span class="applying-detail">正在建立连接并同步配置，请稍候</span><strong>${escapeHtml(peer?.label || '')}</strong></span>`
        : occupied
          ? `<span class="layout-device" draggable="true" data-peer-drag="${escapeHtml(current.fingerprint)}">${svg('monitor','large')}<span class="peer-role">已连接从机</span><strong>${escapeHtml(current.label)}</strong><span class="small"><span class="dot ${current.online?'green':''}" style="display:inline-block"></span> ${current.online?'在线':'离线'}</span></span>`
          : `<span>${svg('monitor','large')}<strong>${placementLabel(position)}</strong><small>拖到此处</small></span>`;
      return `<button class="layout-slot ${occupied?'occupied':''} ${applying?'applying':''}" data-placement="${position}" data-layout-drop="${position}" aria-label="${placementLabel(position)}布局位置" ${applying?'aria-busy="true" disabled':''}>${content}</button>`;
    }

    function draggablePeer(peer, pending) {
      const applying = pending?.fingerprint === peer.fingerprint;
      return `<div class="draggable-peer ${peer.online?'':'offline'} ${applying?'applying':''}" draggable="${peer.online && !applying}" data-peer-drag="${escapeHtml(peer.fingerprint)}" ${applying?'aria-busy="true"':''}>${applying?'<span class="spinner"></span>':svg('monitor','large')}<div><strong>${escapeHtml(peer.label)}</strong><span class="small">${applying?'应用中':`<span class="dot ${peer.online?'green':''}" style="display:inline-block"></span> ${peer.online?'在线':'离线'}${peer.current?' · 当前设备':''}`}</span></div><button class="button ghost ssh-device-link" data-ssh="go" data-peer="${escapeHtml(peer.fingerprint)}" draggable="false">SSH</button></div>`;
    }

    function renderClipboard() {
      const m = currentModel(), s = m.shared;
      return heading('共享剪贴板', '在已配对电脑之间同步常用剪贴板内容') + `
        <article class="card master-card"><div class="row between"><div class="setting-label"><h2>开启共享剪贴板</h2><span class="muted">复制后自动发送到当前已配对设备</span>${chip(s.enabled?'运行中':'未开启',s.enabled?'green':'')}</div>${switchButton(s.enabled,'toggle-shared','开启共享剪贴板')}</div></article>
        <div class="section-title"><h2>支持的内容</h2></div><div class="capability-grid">${capability('file','纯文字','Unicode 文本')}${capability('globe','网页与富文本','HTML · RTF')}${capability('image','截图与图片','PNG · DIBV5 · DIB')}</div>
        <article class="card sync-card" style="margin-top:16px"><h2>最近一次同步</h2>${s.lastDirection ? `<div class="sync-route"><div class="device-box">${svg('monitor')}本机</div><div class="route-arrow"></div><div class="device-box">${svg('monitor')}${escapeHtml(m.peerLabel)}</div></div><div class="sync-facts"><div><span class="muted small">方向</span><div>${escapeHtml(s.lastDirection)}</div></div><div><span class="muted small">格式</span><div>${escapeHtml(s.lastFormats)}</div></div><div><span class="muted small">大小</span><div>${escapeHtml(s.lastBytes)}</div></div><div><span class="muted small">状态</span><div style="color:var(--green)">${svg('check')} 同步完成</div></div></div>` : `<div class="empty">等待新的复制内容</div>`}<p class="muted small">${svg('lock')} 内容仅通过已配对设备之间的局域网加密连接传输</p></article>
        <article class="card info-strip" style="margin-top:16px"><span class="round-icon">${svg('folder','large')}</span><div style="flex:1"><h3>文件和文件夹</h3><span class="muted">由文件剪贴板通道处理；在另一台电脑的资源管理器中直接粘贴</span></div><button class="button ghost" data-page="transfer">前往传输中心${svg('chevron')}</button></article>`;
    }
    function capability(ico,title,sub) { return `<article class="card capability"><span class="round-icon">${svg(ico,'large')}</span><div><h3>${title}</h3><span class="muted small">${sub}</span></div><div class="capability-check"><span style="color:#22b43a">${svg('check')}</span>随总开关启用</div></article>`; }

    function renderTransfer() {
      const m = currentModel(), t = m.transfer, tasks = t.tasks || [], task = tasks[0];
      const controls = tasks.filter(task => task.controllable === true);
      return heading('传输中心', '查看状态并控制正在进行的文件传输') + `
        <article class="card transfer-summary"><h2>${tasks.length ? `${tasks.length} 个任务正在传输` : '当前没有传输任务'}</h2><span>${task ? `${escapeHtml(task.transferred)} / ${escapeHtml(task.total)}` : '—'}</span><span>${m.language==='en'?'Current speed':'实时速度'} ${task ? escapeHtml(task.speed) : '—'}</span><div class="stack"><button class="button primary" data-action="open-transfer">${svg('external')}打开独立传输中心</button><span class="muted small">关闭窗口不会暂停或取消传输</span></div></article>
        <div class="section-title between"><h2>当前任务</h2><div class="row"><button class="button" data-action="pause-all" ${controls.some(task=>task.stateCode!=='paused')?'':'disabled'}>${svg('pause')}全部暂停</button><button class="button" data-action="resume-all" ${controls.some(task=>task.stateCode==='paused')?'':'disabled'}>${svg('play')}全部继续</button><button class="button danger" data-confirm="cancel-all" ${controls.length?'':'disabled'}>${svg('cancel')}全部取消</button></div></div>
        <p class="muted small">${m.language==='en'?'Pause, resume or cancel transfers from either device.':'发送和接收设备均可暂停、继续或取消传输。'}</p>
        ${tasks.length ? tasks.map(transferTask).join('') : `<article class="card empty">窗口保持可用；收到任务后可以随时打开查看。</article>`}
        <div class="section-title"><h2>待确认的文件剪贴板</h2></div><article class="card pending-card"><div class="row">${svg('clipboard','large')}<span>${t.pendingOffer?'收到待确认的远端文件清单':'没有待确认的文件剪贴板'}</span></div><button class="button ${t.pendingOffer?'primary':''}" data-action="accept-pending" ${t.pendingOffer?'':'disabled'}>接收待确认内容</button></article>
        <div class="section-title"><h2>窗口与历史记录</h2></div><article class="card preference-grid"><div class="setting-row"><strong>收到新传输时自动弹出窗口</strong>${switchButton(t.autoPopup,'toggle-auto-popup','收到新传输时自动弹出窗口')}</div><div class="setting-row"><div class="setting-label"><strong>历史记录保留</strong><span class="muted small">范围 1–500</span></div>${stepper('history',t.historyLimit,'条')}</div><div class="setting-row"><strong>历史记录行高</strong>${stepper('row-height',t.rowHeight,'px')}</div><div class="setting-row"><span class="muted">完整任务表与详情位于独立窗口</span><button class="button" data-action="open-transfer-history">查看历史记录${svg('chevron')}</button></div></article>`;
    }
    function transferTask(task) {
      const paused = task.stateCode === 'paused', enabled = task.controllable === true;
      const hint = currentModel().language === 'en' ? 'This transfer can be controlled from either device.' : '可在发送或接收设备控制此任务。';
      return `<article class="card transfer-item"><div class="row"><span class="round-icon amber">${svg('folder','large')}</span><div class="setting-label"><strong>${escapeHtml(task.name)}</strong><span class="muted small">${task.files} 个文件 · ${task.directories} 个文件夹</span>${chip(task.state,task.stateCode==='running'?'green':'amber')}</div></div><div class="progress-wrap"><span>${escapeHtml(task.directionDetail)}</span><div class="progress"><i style="width:${Number(task.progress)||0}%"></i></div><div class="row between small"><span>${escapeHtml(task.transferred)} / ${escapeHtml(task.total)}</span><span>${currentModel().language==='en'?'Current speed':'实时速度'} ${escapeHtml(task.speed)}</span></div></div><div class="transfer-actions"><button class="button" data-action="pause-task" data-task="${escapeHtml(task.key)}" ${enabled?'':'disabled'}>${svg(paused?'play':'pause')}${paused?'继续':'暂停'}</button><button class="button" data-action="cancel-task" data-task="${escapeHtml(task.key)}" ${enabled?'':'disabled'}>${svg('cancel')}取消</button>${task.receiving ? `<button class="button details" data-action="open-transfer">查看详情${svg('chevron')}</button>` : `<span class="muted small">${hint}</span>`}</div></article>`;
    }
    function stepper(kind,value,unit) {
      const center = kind === 'history'
        ? `<label class="stepper-input-wrap"><input class="stepper-input" id="history-limit" type="number" min="1" max="500" step="1" value="${value}" inputmode="numeric" aria-label="历史记录保留数量"><span class="stepper-unit">${unit}</span></label>`
        : `<output>${value} ${unit}</output>`;
      return `<div class="stepper"><button data-step="${kind}" data-delta="-1" aria-label="减小">−</button>${center}<button data-step="${kind}" data-delta="1" aria-label="增大">＋</button></div>`;
    }

    function renderConnection() {
      const m = currentModel(), c = state.connectionDraft || {...m.connection};
      const peers = m.peers || [];
      return heading('连接设置', '为特殊局域网环境手动调整当前设备的地址') + `<div class="connection-layout"><div>
        <article class="card discovery-card"><div class="row"><h2>自动发现</h2>${chip(m.discovery.running?'运行中':'不可用',m.discovery.running?'green':'red')}</div><p class="muted">当前地址由局域网发现自动维护</p><div class="discovery-facts"><div class="fact">${svg('devices')}发现 ${m.discovery.peersFound} 台可信设备</div><div class="fact">${svg('check')}当前路由${m.discovery.issue?'存在冲突':'正常'}</div></div></article><p class="muted small">VPN、多网卡或特殊路由下可在下方手动修改</p>
        <form class="card connection-form" id="connection-form"><h2>活动连接</h2><label class="field device-select">活动目标设备<select class="select" id="active-peer">${peers.map(p=>`<option value="${escapeHtml(p.fingerprint)}" ${c.activePeer===p.fingerprint?'selected':''}>${escapeHtml(p.label)}${p.online?' · 在线':''}</option>`).join('')}</select></label><div class="endpoint-grid"><label class="field">本机服务地址<input class="input endpoint" id="local-endpoint" value="${escapeHtml(c.localEndpoint || '')}" spellcheck="false"></label>${svg('arrow')}<label class="field">对端服务地址<input class="input endpoint" id="peer-endpoint" value="${escapeHtml(c.peerEndpoint || '')}" spellcheck="false"></label></div><p class="muted small">仅允许回环地址或专用局域网地址，端口不能为 0</p><div class="setting-row"><div class="setting-label"><strong>自动接收文件清单</strong><span class="muted small">收到该设备的文件清单后，自动替换本机文件剪贴板</span></div>${switchButton(c.autoReceive,'draft-auto-receive','自动接收文件清单')}</div><div class="validation">${svg('check')} ${c.valid === false ? '请检查地址格式' : '地址有效 · 两台设备位于同一局域网路径'}</div><div class="row" style="margin-top:20px"><button class="button primary" type="submit">保存并应用</button><button class="button" type="button" data-action="discard-connection">放弃更改</button></div></form>
      </div><aside class="card connection-help"><h2>适用场景</h2><ul><li>VPN 改变了默认局域网路由</li><li>电脑同时连接多个专用网络</li><li>虚拟网卡占用了对端地址</li></ul><div class="divider"></div><p class="small">检测到地址冲突时，Pierdesk 会保留原配置并暂停该路径；冲突解除后自动恢复。</p><p class="small">每次只能选择一个活动目标设备。</p></aside></div>`;
    }

    function renderGeneral() {
      const m = currentModel(), c = m.cross;

        <div class="about-grid"><article class="card about-story"><h2>跨设备，仍像在本机</h2><p>Pierdesk 把已配对的 Windows 电脑连接成一个连贯工作空间：鼠标越过屏幕边界，键盘随当前设备切换，剪贴板和文件也能继续流转。</p><p>它不投屏、不接管远程桌面。每台电脑保持独立运行，只通过已配对的局域网加密连接同步必要的输入与内容。</p><p>多设备配对和图形化屏幕布局会保留每台电脑的可信身份与位置，重新上线后无需重复配置。</p></article><article class="card project-info"><h2>版本与开源</h2><div class="info-table"><div class="info-row"><span class="muted">版本</span><strong>${escapeHtml(m.version)}</strong></div><div class="info-row"><span class="muted">支持系统</span><strong>Windows 10 / 11 x64</strong></div><div class="info-row"><span class="muted">许可证</span><strong>GPL-3.0-only</strong></div><div class="info-row"><span class="muted">源代码</span><button class="link-button" data-action="open-source">github.com/micky-meecky/Pierdesk</button></div></div><p class="muted small">${svg('lock')} 文件与输入只在已配对设备之间通过局域网传输</p></article></div>${currentModel().licenseEnabled ? `<article class="card about-support"><div class="about-support-copy"><h2>永久授权 · 一码一机</h2><p>在激活与授权中管理当前电脑的使用授权。</p></div><button class="button" data-page="license">${svg('lock')}激活与授权</button></article>` : `<article class="card about-support"><div class="about-support-copy"><h2>支持完全自愿</h2><p>Pierdesk 的所有核心功能都会保持免费开放。</p></div><button class="button" data-page="support">${svg('heart')}前往支持作者</button></article>`}<article class="card quote">“ 跨过屏幕边界，继续手头的工作。 ”</article>`;
