[package]
name = "clipferry-license-server"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[dependencies]
axum = "0.8"
clipferry-license-protocol = { path = "../protocol" }
ring = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
