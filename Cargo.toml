[package]
name = "pierdesk"
version = "1.0.52"
edition = "2024"
authors = ["micky-meecky"]
license = "GPL-3.0-only"
description = "A lightweight native Windows LAN file clipboard and cross-screen controller"
repository = "https://github.com/micky-meecky/Pierdesk"

[workspace]
members = ["licensing/protocol", "licensing/server"]
default-members = ["."]
exclude = ["vendor/snow-visual-region-detector"]

[features]
default = []
licensing = ["dep:clipferry-license-protocol", "dep:ureq", "dep:url"]

[dependencies]
base64 = "0.22.1"
getrandom = "0.3.4"
clipferry-license-protocol = { path = "licensing/protocol", optional = true }
rcgen = { version = "0.14.9", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"], optional = true }
url = { version = "2.5", optional = true }
sha2 = "0.10.9"
webview2-com = "0.39.1"
zeroize = "1.9.0"
visual-region-detector = { path = "vendor/snow-visual-region-detector", default-features = false, features = ["pure-rust"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Imaging",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_QoS",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_TaskScheduler",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
